name: Build VPS stats runtime

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: stats-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: stats-dashboard/package-lock.json
      - run: npm ci
      - run: npm run check && npm test
      - name: Build VPS analytics module
        run: npx esbuild src/index.ts --bundle --format=esm --platform=node --target=node22 --outfile=dist/stats-worker.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: vps-stats-runtime
          path: stats-dashboard/dist/stats-worker.mjs
